name: Appli iPhone
# Construit l'appli iPhone sur un Mac de GitHub et l'envoie sur TestFlight.
# Il faut d'abord ranger dans les secrets du dépôt (Settings › Secrets and variables › Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe du compte développeur Apple
#   ASC_KEY_ID      Key ID de la clé App Store Connect (rôle App Manager)
#   ASC_ISSUER_ID   Issuer ID affiché au-dessus de la liste des clés
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8
# Sans ces secrets, la tâche s'arrête proprement sans rien envoyer.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  testflight:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: io.github.viktorlorain.brumes
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Secrets Apple présents ?
        id: check
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Secrets Apple absents : l'appli iPhone n'est pas construite pour l'instant."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.check.outputs.ready == 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Jeu et projet iPhone
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          npx cap add ios
          npx --yes @capacitor/assets@3.0.5 generate --ios --iconBackgroundColor "#0e2533" --splashBackgroundColor "#0e2533" --splashBackgroundColorDark "#0e2533" || true
          npx cap sync ios
      - name: Réglages de l'appli (portrait, chiffrement standard)
        if: steps.check.outputs.ready == 'true'
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PL
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PL
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PL || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Brumes" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Brumes" $PL
      - name: Clé App Store Connect
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive signée
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Brumes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="0.1.$BUILD_NUMBER" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" TARGETED_DEVICE_FAMILY=1 \
            archive
      - name: Envoi sur TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Brumes.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Version 0.1.$BUILD_NUMBER envoyée sur TestFlight. Elle apparaît dans App Store Connect après quelques minutes de traitement."
      - name: Nettoyage de la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
