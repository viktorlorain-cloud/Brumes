name: Aperçu
# Vérifie que la branche preview se construit. La mise en ligne est ensuite faite
# par le workflow « Mise en ligne » (lancé depuis main, seule branche autorisée à publier).
on:
  push:
    branches: [preview]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        env:
          BRUMES_CHANNEL: preview
